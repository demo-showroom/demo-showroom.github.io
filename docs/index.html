<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta
      name="description"
      content="BMW X6 xDrive40i M Sport 2022 · 32.000 km · Gs. 690.000.000 — Showroom digital Sol Naciente. Galería, video, especificaciones y test drive."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23FFD21F'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='46'%3E%E2%98%80%3C/text%3E%3C/svg%3E"
    />
    <title>BMW X6 xDrive40i M Sport 2022 · Sol Naciente Showroom</title>
    <style>
      html, body { margin: 0; padding: 0; background: #060607; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
        min-height: 100%; }
      #sn-loader { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
      .sn-sun { width: 64px; height: 64px; border-radius: 50%; background: #FFD21F; color: #000;
        font-size: 32px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
      .sn-spin { width: 38px; height: 38px; border-radius: 50%;
        border: 3px solid rgba(255,210,31,.2); border-top-color: #FFD21F;
        animation: snspin .9s linear infinite; }
      @keyframes snspin { to { transform: rotate(360deg); } }
      .sn-t { font-weight: 800; letter-spacing: .14em; font-size: 12px; color: #FFD21F; }
      .sn-s { font-size: 13px; color: rgba(255,255,255,.55); }
      #sn-fallback-err { display: none; max-width: 380px; background: #141416;
        border: 1px solid rgba(255,210,31,.3); border-radius: 20px; padding: 24px; }
      #sn-fallback-err h2 { color: #FFD21F; font-size: 17px; margin: 0 0 8px; }
      #sn-fallback-err p { color: rgba(255,255,255,.65); font-size: 13px; margin: 0 0 14px; line-height: 1.55; }
      .sn-btn { display: inline-block; background: #FFD21F; color: #000; border-radius: 12px;
        padding: 12px 22px; font-weight: 800; font-size: 14px; text-decoration: none; border: 0; cursor: pointer; }
      .sn-ghost { display: inline-block; background: rgba(255,255,255,.1); color: #fff; border: 0;
        border-radius: 12px; padding: 10px 20px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 14px; }
    </style>
